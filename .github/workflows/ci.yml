name: CI — Phishing Detector

# Se activa en cada push y pull request a main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests y análisis de seguridad
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repo
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. Cachear dependencias para que sea más rápido
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      # 5. Descargar recursos de NLTK
      - name: Descargar recursos NLTK
        run: |
          python -c "
          import nltk
          nltk.download('stopwords')
          nltk.download('punkt')
          nltk.download('wordnet')
          nltk.download('omw-1.4')
          "

      # 6. Correr tests del preprocesador
      - name: Tests de NLP
        run: |
          pytest tests/test_preprocessor.py -v --tb=short

      # 7. Descargar datos y entrenar modelo
      - name: Entrenar modelo
        run: |
          python download_data.py
          cd src && python train_model.py

      # 8. Correr todos los tests con reporte de cobertura
      - name: Tests completos con cobertura
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      # 9. Análisis de seguridad del código con Bandit
      # Bandit escanea el código Python buscando vulnerabilidades comunes
      - name: Análisis de seguridad (Bandit)
        run: |
          bandit -r src/ api/ -ll --format txt || true

      # 10. Verificar que la API responde correctamente
      - name: Test de integración — API
        run: |
          cd api && python app.py &
          sleep 3
          curl -f http://localhost:5000/health
          curl -f -X POST http://localhost:5000/predecir \
            -H "Content-Type: application/json" \
            -d '{"texto": "FREE prize click NOW http://fake.com"}'