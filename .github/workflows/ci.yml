name: CI — Phishing Detector

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Tests y análisis de seguridad
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit

      - name: Descargar recursos NLTK
        run: |
          python -c "
          import nltk
          nltk.download('stopwords')
          nltk.download('punkt')
          nltk.download('punkt_tab')
          nltk.download('wordnet')
          nltk.download('omw-1.4')
          "

      - name: Tests de NLP
        run: |
          pytest tests/test_preprocessor.py -v --tb=short

      - name: Entrenar modelo
        run: |
          python download_data.py
          cd src && python train_model.py

      - name: Tests completos con cobertura
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing

      - name: Análisis de seguridad (Bandit)
        run: |
          bandit -r src/ api/ -ll --format txt || true

      - name: Test de integración — API
        run: |
          cd api && python app.py &
          sleep 5
          curl -f http://localhost:5000/health
          curl -f -X POST http://localhost:5000/predecir \
            -H "Content-Type: application/json" \
            -d '{"texto": "FREE prize click NOW http://fake.com"}'